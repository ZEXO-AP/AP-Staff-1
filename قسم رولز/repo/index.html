<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نظام الجرد والتقارير الذكي</title>
  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: #1e293b;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --border: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      padding: 30px 20px;
      min-height: 100vh;
    }

    .wrapper { max-width: 1200px; margin: 0 auto; }
    header { text-align: center; margin-bottom: 25px; }
    header h1 { font-size: 1.8rem; color: #60a5fa; margin-bottom: 8px; }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
    @media (max-width: 768px) { .grid { grid-template-columns: 1fr; } }

    .box {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 15px;
      display: flex;
      flex-direction: column;
    }
    .box label {
      font-size: 0.9rem;
      font-weight: bold;
      margin-bottom: 10px;
      color: var(--text-sub);
    }
    textarea {
      width: 100%;
      height: 380px;
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      color: var(--text-main);
      font-family: 'Courier New', Courier, monospace;
      font-size: 0.95rem;
      line-height: 1.6;
      resize: none;
      outline: none;
      direction: ltr;
      text-align: left;
    }
    textarea:focus { border-color: var(--accent); }

    .full-width-box { margin-top: 20px; }
    .full-width-box textarea { height: 220px; }

    .input-author {
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .input-author input {
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 12px;
      color: var(--text-main);
      outline: none;
      font-size: 0.9rem;
      flex: 1;
    }
    .input-author input:focus { border-color: var(--accent); }

    .stats-bar {
      margin-top: 15px;
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 15px;
      font-size: 0.9rem;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .stats-count { color: #60a5fa; font-weight: bold; }
    .stats-duplicates { color: #f87171; font-weight: bold; }

    .actions {
      display: flex;
      gap: 10px;
      margin-top: 20px;
      justify-content: center;
      flex-wrap: wrap;
    }
    button.action-btn {
      background: var(--accent);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }
    button.secondary {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-sub);
    }

    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #10b981;
      color: white;
      padding: 10px 20px;
      border-radius: 6px;
      font-size: 0.9rem;
      opacity: 0;
      transition: all 0.3s ease;
    }
    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
  
    /* Glass visual skin — appearance only */
    :root {
      color-scheme: dark light;
      --glass-page: #08111f;
      --glass-page-2: #0d1930;
      --glass-surface: rgba(19, 31, 52, 0.72);
      --glass-surface-strong: rgba(12, 23, 41, 0.84);
      --glass-field: rgba(5, 14, 28, 0.72);
      --glass-border: rgba(168, 194, 234, 0.18);
      --glass-border-strong: rgba(122, 168, 255, 0.42);
      --glass-text: #edf5ff;
      --glass-muted: #a9b8cf;
      --glass-accent: #6ea8ff;
      --glass-accent-2: #8a7cff;
      --glass-shadow: 0 18px 50px rgba(0, 0, 0, 0.26);
      --glass-inner: inset 0 1px 0 rgba(255, 255, 255, 0.055);
    }

    body {
      font-family: "Segoe UI Variable", "Segoe UI", Tahoma, Arial, sans-serif;
      background-color: var(--glass-page);
      background-image:
        radial-gradient(circle at 12% 8%, rgba(110, 168, 255, 0.13), transparent 31%),
        radial-gradient(circle at 88% 12%, rgba(138, 124, 255, 0.11), transparent 28%),
        linear-gradient(145deg, var(--glass-page), var(--glass-page-2));
      color: var(--glass-text);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    header h1 {
      color: var(--glass-accent);
      text-shadow: 0 0 26px rgba(110, 168, 255, 0.18);
      letter-spacing: 0.01em;
    }

    .box {
      background: linear-gradient(160deg, rgba(255, 255, 255, 0.075), rgba(255, 255, 255, 0.025));
      border-color: var(--glass-border);
      box-shadow: var(--glass-inner), var(--glass-shadow);
      backdrop-filter: blur(18px) saturate(125%);
      -webkit-backdrop-filter: blur(18px) saturate(125%);
      border-radius: 16px;
    }

    .box label {
      color: var(--glass-muted);
    }

    textarea,
    .input-author input {
      background: var(--glass-field);
      border-color: var(--glass-border);
      color: var(--glass-text);
      box-shadow: var(--glass-inner), inset 0 12px 30px rgba(0, 0, 0, 0.08);
      border-radius: 10px;
      transition: border-color 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;
    }

    textarea::placeholder,
    .input-author input::placeholder {
      color: color-mix(in srgb, var(--glass-muted) 72%, transparent);
    }

    textarea:focus,
    .input-author input:focus {
      border-color: var(--glass-accent);
      box-shadow: 0 0 0 3px rgba(110, 168, 255, 0.12), var(--glass-inner);
      background: var(--glass-surface-strong);
    }

    .stats-bar {
      background: rgba(8, 18, 34, 0.58);
      border-color: var(--glass-border);
      box-shadow: var(--glass-inner);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 10px;
    }

    .stats-count {
      color: #8fc2ff;
    }

    button.action-btn {
      background: linear-gradient(135deg, var(--glass-accent), var(--glass-accent-2));
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 10px 24px rgba(75, 118, 218, 0.22), var(--glass-inner);
      border-radius: 10px;
      transition: filter 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }

    button.action-btn:hover {
      filter: brightness(1.07);
      box-shadow: 0 12px 28px rgba(75, 118, 218, 0.28), var(--glass-inner);
    }

    button.secondary {
      background: rgba(255, 255, 255, 0.045);
      border-color: var(--glass-border);
      color: var(--glass-muted);
      box-shadow: var(--glass-inner);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    button.secondary:hover {
      border-color: var(--glass-border-strong);
      color: var(--glass-text);
      background: rgba(255, 255, 255, 0.075);
    }

    .toast {
      background: rgba(16, 185, 129, 0.84);
      border: 1px solid rgba(255, 255, 255, 0.13);
      box-shadow: 0 14px 34px rgba(0, 0, 0, 0.24);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-radius: 10px;
    }

    ::selection {
      background: rgba(110, 168, 255, 0.3);
      color: var(--glass-text);
    }

    @media (prefers-color-scheme: light) {
      :root {
        --glass-page: #eaf1fb;
        --glass-page-2: #f7faff;
        --glass-surface: rgba(255, 255, 255, 0.58);
        --glass-surface-strong: rgba(255, 255, 255, 0.78);
        --glass-field: rgba(255, 255, 255, 0.56);
        --glass-border: rgba(65, 89, 126, 0.16);
        --glass-border-strong: rgba(58, 110, 205, 0.42);
        --glass-text: #17243a;
        --glass-muted: #63738d;
        --glass-accent: #3978dc;
        --glass-accent-2: #6659dd;
        --glass-shadow: 0 18px 42px rgba(65, 86, 120, 0.14);
        --glass-inner: inset 0 1px 0 rgba(255, 255, 255, 0.78);
      }

      body {
        background-image:
          radial-gradient(circle at 12% 8%, rgba(57, 120, 220, 0.11), transparent 31%),
          radial-gradient(circle at 88% 12%, rgba(102, 89, 221, 0.09), transparent 28%),
          linear-gradient(145deg, var(--glass-page), var(--glass-page-2));
      }

      .box {
        background: linear-gradient(160deg, rgba(255, 255, 255, 0.68), rgba(255, 255, 255, 0.42));
      }

      .stats-bar {
        background: rgba(255, 255, 255, 0.5);
      }

      .stats-count {
        color: #2f6fc9;
      }

      button.secondary {
        background: rgba(255, 255, 255, 0.42);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      textarea,
      .input-author input,
      button.action-btn,
      button.secondary {
        transition: none;
      }
    }

<body>

  <div class="wrapper">
    <header>
      <h1>نظام معالجة والجرد الذكي</h1>
    </header>

    <div class="grid">
      <div class="box">
        <label>1. المدخلات (بيانات الاستبيان):</label>
        <textarea id="inputData" placeholder="الصق الاستبيانات هنا..."></textarea>
      </div>
      <div class="box">
        <label>2. المخرجات (نتيجة الجرد):</label>
        <textarea id="outputData" placeholder="ستظهر النتيجة هنا..." readonly></textarea>
        <div class="stats-bar">
          <div id="totalCount" class="stats-count">إجمالي العدد: 0</div>
          <div id="duplicateAlert" class="stats-duplicates" style="display: none;"></div>
        </div>
      </div>
    </div>

    <div class="box full-width-box">
      <div class="input-author">
        <label style="margin: 0; min-width: 140px;">منشئ التقرير (اسمك/المنشن):</label>
        <input type="text" id="authorName" placeholder="أدخل اسمك..." oninput="processData()">
      </div>
      <label>3. نموذج التقرير الأسبوعي (جاهز للنسخ):</label>
      <textarea id="reportData" readonly></textarea>
    </div>

    <div class="actions">
      <button class="action-btn" onclick="processData()">معالجة وتحديث</button>
      <button class="action-btn secondary" onclick="copyResult('outputData')">نسخ الجرد</button>
      <button class="action-btn secondary" onclick="copyResult('reportData')">نسخ التقرير الأسبوعي</button>
      <button class="action-btn secondary" onclick="clearAll()">مسح الكل</button>
    </div>
  </div>

  <div id="toast" class="toast">تم النسخ بنجاح!</div>

  <script>
    const OUT_OF_SERVICE_ROLE_ID = "1135000856043995233";
    const OUT_OF_SERVICE_ROLE_MENTION = `<@&${OUT_OF_SERVICE_ROLE_ID}>`;

    function removeFancyFont(text) {
      if (!text) return '';
      let str = text.normalize('NFKD');
      let clean = '';
      for (let i = 0; i < str.length; i++) {
        let code = str.charCodeAt(i);
        if (code >= 0xD835) {
          let codePoint = str.codePointAt(i);
          if (codePoint >= 0x1D400 && codePoint <= 0x1D419) clean += String.fromCharCode(65 + (codePoint - 0x1D400));
          else if (codePoint >= 0x1D41A && codePoint <= 0x1D433) clean += String.fromCharCode(97 + (codePoint - 0x1D41A));
          else if (codePoint >= 0x1D434 && codePoint <= 0x1D44D) clean += String.fromCharCode(65 + (codePoint - 0x1D434));
          else if (codePoint >= 0x1D44E && codePoint <= 0x1D467) clean += String.fromCharCode(97 + (codePoint - 0x1D44E));
          else if (codePoint >= 0x1D468 && codePoint <= 0x1D481) clean += String.fromCharCode(65 + (codePoint - 0x1D468));
          else if (codePoint >= 0x1D482 && codePoint <= 0x1D49B) clean += String.fromCharCode(97 + (codePoint - 0x1D482));
          else if (codePoint >= 0x1D5D4 && codePoint <= 0x1D5ED) clean += String.fromCharCode(65 + (codePoint - 0x1D5D4));
          else if (codePoint >= 0x1D5EE && codePoint <= 0x1D607) clean += String.fromCharCode(97 + (codePoint - 0x1D5EE));
          else if (codePoint >= 0x1D608 && codePoint <= 0x1D621) clean += String.fromCharCode(65 + (codePoint - 0x1D608));
          else if (codePoint >= 0x1D622 && codePoint <= 0x1D63B) clean += String.fromCharCode(97 + (codePoint - 0x1D622));
          else if (codePoint >= 0x1D63C && codePoint <= 0x1D655) clean += String.fromCharCode(65 + (codePoint - 0x1D63C));
          else if (codePoint >= 0x1D656 && codePoint <= 0x1D66F) clean += String.fromCharCode(97 + (codePoint - 0x1D656));
          i++;
        } else {
          clean += str[i];
        }
      }
      return clean.replace(/[\u0300-\u036f]/g, '').trim();
    }

    function cleanAndStandardizeRank(rawRank) {
      if (!rawRank) return '';
      let clean = removeFancyFont(rawRank);
      const standardRanks = [
        "Supervisor", "Mod", "Super Admin", "Head Admin", "Admin",
        "Controller", "Hand of the king", "Pre Master", "Master", "Advisor",
        "Operator", "Marshal", "Manager", "Director", "Executive",
        "President", "Commander", "Mythical", "Colonel", "Boss",
        "Big Boss", "CEO", "Co Founder", "Founder", "Consultant"
      ];
      const lowerClean = clean.toLowerCase();
      for (let rank of standardRanks) {
        if (lowerClean.includes(rank.toLowerCase())) return rank;
      }
      return clean;
    }

    function formatUserMention(rawInputId) {
      if (!rawInputId) return '';
      const digitMatch = rawInputId.match(/\d{17,20}/);
      if (digitMatch) return `<@${digitMatch[0]}>`;
      let clean = rawInputId.replace(/[\u200B-\u200D\uFEFF\u200F]/g, '').replace(/@+/g, '').trim();
      return `<@${clean}>`;
    }

    function extractRoleMention(text) {
      if (!text) return '';
      const match = text.match(/<@&\d{17,20}>/);
      return match ? match[0] : '';
    }

    function getOutOfServiceStatus(finalEval, rawEval) {
      const importantFields = [finalEval || '', rawEval || ''];
      const combinedText = importantFields.join(' ');
      const lowerText = combinedText.toLowerCase();
      const mentionFromFinal = extractRoleMention(finalEval);
      const mentionFromRaw = extractRoleMention(rawEval);
      const detectedMention = mentionFromFinal || mentionFromRaw;

      const hasOutOfServiceText = lowerText.includes('خارج الخدمة') || lowerText.includes('خارج خدمة');
      const hasRoleMention = !!detectedMention;
      const hasConfiguredRole = importantFields.some(field => field.includes(OUT_OF_SERVICE_ROLE_ID) || field.includes(OUT_OF_SERVICE_ROLE_MENTION));

      if (hasOutOfServiceText || hasRoleMention || hasConfiguredRole) {
        return {
          isOutOfService: true,
          roleMention: detectedMention || OUT_OF_SERVICE_ROLE_MENTION
        };
      }

      return { isOutOfService: false, roleMention: '' };
    }

    function processData() {
      const input = document.getElementById('inputData').value;
      const totalCountElem = document.getElementById('totalCount');
      const duplicateAlertElem = document.getElementById('duplicateAlert');
      const authorName = document.getElementById('authorName').value.trim();

      if (!input.trim()) {
        document.getElementById('outputData').value = '';
        document.getElementById('reportData').value = '';
        totalCountElem.textContent = 'إجمالي العدد: 0';
        duplicateAlertElem.style.display = 'none';
        return;
      }

      const lineSeparator = '`-----------------------------------------------------`';
      let result = `${lineSeparator}\n`;
      let processedCount = 0;
      let idTracker = {};

      let countNew = 0;
      let countOut = 0;
      let countBad = 0;
      let countActive = 0;

      const entries = input.split(/(?=الايدي\s*:)/g);

      entries.forEach((entry) => {
        if (!entry.trim()) return;

        let data = { id: '', rank: '', finalEval: '', rawEval: '' };
        const lines = entry.split(/\r?\n/);

        lines.forEach(line => {
          if (!line.includes(':')) return;
          const parts = line.split(':');
          const key = parts[0].trim();
          const val = parts.slice(1).join(':').trim();

          if (key.includes('الايدي')) data.id = val;
          else if (key.includes('الرتبة الادارية') || key.includes('الرتبة')) data.rank = val;
          else if (key.includes('التقيم النهائي') || key.includes('التقييم النهائي')) data.finalEval = val;
          else if (key === 'التقييم' || key === 'التقيم') data.rawEval = val;
        });

        if (data.id) {
          processedCount++;

          let rawKey = data.id.replace(/[^0-9]/g, '');
          if (rawKey) idTracker[rawKey] = (idTracker[rawKey] || 0) + 1;

          const cleanRank = cleanAndStandardizeRank(data.rank);
          let finalRating = data.finalEval || data.rawEval || 'سيء';
          const outOfServiceStatus = getOutOfServiceStatus(data.finalEval, data.rawEval);

          if (finalRating.includes('جديد')) {
            countNew++;
          }

          if (outOfServiceStatus.isOutOfService || finalRating.includes('إجازة')) {
            countOut++;
            finalRating = outOfServiceStatus.roleMention || OUT_OF_SERVICE_ROLE_MENTION;
          } else if (finalRating.includes('سيء') || finalRating.includes('سئ')) {
            countBad++;
          } else if (['جيد جدا', 'ممتاز', 'ممتاز جدا'].some(r => finalRating.includes(r))) {
            countActive++;
          }

          let formattedMention = formatUserMention(data.id);
          result += `${formattedMention}\nالتقييم : ${finalRating}\nالرتبة الادارية : ${cleanRank}\n${lineSeparator}\n`;
        }
      });

      document.getElementById('outputData').value = result;
      totalCountElem.textContent = `إجمالي العدد: ${processedCount}`;

      const weeklyReport = `** كم العدد حالي بالقسم: ${processedCount}\n\n` +
        `كم عدد ماخذين اجازة : ${countOut} ( ${countNew}جديد)\n\n` +
        `عدد غير متفاعلين : ${countBad}\n\n` +
        `عدد المتفاعلين بالقسم : ${countActive}\n` +
        `هل يوجد ملاحظة بالقسم او حاب تطور شي من جميع نواحي : لايوجد يعطيكم العافية   \n\n` +
        `تم انشاء التقرير من قبل : ( ${authorName} ) **`;

      document.getElementById('reportData').value = weeklyReport;

      let duplicates = Object.keys(idTracker).filter(key => idTracker[key] > 1);
      if (duplicates.length > 0) {
        duplicateAlertElem.style.display = 'block';
        duplicateAlertElem.innerHTML = `⚠️ تنبيه: يوجد IDs مكررة: <br>${duplicates.map(d => `- ${d} (تكرر ${idTracker[d]} مرات)`).join('<br>')}`;
      } else {
        duplicateAlertElem.style.display = 'none';
      }
    }

    function copyResult(elementId) {
      const output = document.getElementById(elementId);
      if (!output.value) return;
      output.select();
      navigator.clipboard.writeText(output.value);
      showToast();
    }

    function clearAll() {
      document.getElementById('inputData').value = '';
      document.getElementById('outputData').value = '';
      document.getElementById('reportData').value = '';
      document.getElementById('authorName').value = '';
      document.getElementById('totalCount').textContent = 'إجمالي العدد: 0';
      document.getElementById('duplicateAlert').style.display = 'none';
    }

    function showToast() {
      const toast = document.getElementById('toast');
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }

    document.getElementById('inputData').addEventListener('input', processData);
  </script>
</body>
</html>
